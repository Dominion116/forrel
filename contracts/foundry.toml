[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/"]
# Deploy.s.sol writes ../deployments/diana.json after a broadcast;
# CoreVectors.t.sol reads the signed-message vectors generated by packages/core.
fs_permissions = [
  { access = "write", path = "../deployments" },
  { access = "read", path = "../packages/core/vectors" },
]

[fuzz]
runs = 512

# Public QoreChain EVM endpoints. Use them by name:
#   forge script ... --rpc-url qorechain_testnet
[rpc_endpoints]
qorechain = "https://evm.qore.host"
qorechain_testnet = "https://evm-testnet.qore.host"
